<style>
:root{--ivory:#faf7f1;--cream:#f4eee3;--paper:#fffdf9;--gold:#b8975a;--goldt:#7d5f2b;--rule:rgba(184,151,90,.42);--ink:#2a2420;--mute:#6e655b;--wine:#8e2b2b;
--gg:linear-gradient(155deg,#a8874c 0%,#8f7038 52%,#7a5c29 100%);--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 70% at 50% 0%,#fffdf9 0%,var(--ivory) 45%,var(--cream) 100%);color:var(--ink);font-family:var(--sans)}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 22px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 22px)}
.top{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 14px)}
.lang{display:flex;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--paper)}
.lang button{min-width:44px;height:44px;border:0;background:transparent;color:var(--goldt);font:600 12px var(--sans);letter-spacing:1.8px;cursor:pointer}
.lang button.on{background:var(--gg);color:#fffaf0;text-shadow:0 1px 1px rgba(60,40,12,.3)}
.mark{width:76px;height:76px;border-radius:50%;border:1px solid var(--gold);box-shadow:0 0 0 5px var(--ivory),0 0 0 6px rgba(184,151,90,.45);display:flex;align-items:center;justify-content:center;color:#9a7a41;font:600 42px var(--serif);margin:0 auto 22px;background:var(--paper)}
h1{font:600 36px/1.1 var(--serif);color:var(--ink);text-align:center;margin:0;letter-spacing:.3px}
.sub{color:var(--goldt);text-align:center;font-size:10.5px;font-weight:500;letter-spacing:3.2px;text-transform:uppercase;margin:12px 0 8px}
.rule{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 28px}
.card{width:100%;max-width:400px;background:var(--paper);border:1px solid rgba(184,151,90,.3);border-radius:22px;padding:28px 22px 22px;box-shadow:0 30px 60px -36px rgba(42,36,32,.45)}
label.f{display:block;font-size:10.5px;font-weight:500;letter-spacing:2.2px;text-transform:uppercase;color:var(--goldt);margin:0 0 7px}
input[type=email],input[type=password]{width:100%;height:50px;font:16px var(--sans);padding:0 14px;border:1px solid var(--rule);border-radius:12px;background:var(--ivory);color:var(--ink);margin-bottom:18px;outline:none;-webkit-appearance:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,151,90,.22);background:#fff}
.rem{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;color:var(--ink);cursor:pointer;margin:-6px 0 14px}
.rem input{width:22px;height:22px;accent-color:#8f7038;margin:0}
button.go{width:100%;height:52px;border:1px solid #7a5c29;border-radius:14px;background:var(--gg);color:#fffaf0;font:600 15px var(--sans);letter-spacing:1.6px;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,250,235,.35),0 8px 18px -8px rgba(122,92,41,.55);text-shadow:0 1px 1px rgba(60,40,12,.3)}
button.go:disabled{opacity:.65}
.err{min-height:22px;color:var(--wine);font-size:14px;margin-top:12px;text-align:center}
.foot{color:var(--mute);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:26px;text-align:center}
</style>
</head>
