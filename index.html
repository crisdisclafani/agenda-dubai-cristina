<style>
:root{--ivory:#faf7f1;--cream:#f4eee3;--paper:#fffdf9;--gold:#b8975a;--goldt:#7d5f2b;--rule:rgba(184,151,90,.42);--ink:#2a2420;--mute:#6e655b;--wine:#8e2b2b;
--gg:linear-gradient(155deg,#a8874c 0%,#8f7038 52%,#7a5c29 100%);--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 70% at 50% 0%,#fffdf9 0%,var(--ivory) 45%,var(--cream) 100%);color:var(--ink);font-family:var(--sans)}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 22px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 22px)}
.top{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 14px)}
.lang{display:flex;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--paper)}
.lang button{min-width:44px;height:44px;border:0;background:transparent;color:var(--goldt);font:600 12px var(--sans);letter-spacing:1.8px;cursor:pointer}
.lang button.on{background:var(--gg);color:#fffaf0;text-shadow:0 1px 1px rgba(60,40,12,.3)}
.mark{width:76px;height:76px;border-radius:50%;border:1px solid var(--gold);box-shadow:0 0 0 5px var(--ivory),0 0 0 6px rgba(184,151,90,.45);display:flex;align-items:center;justify-content:center;color:#9a7a41;font:600 42px var(--serif);margin:0 auto 22px;background:var(--paper)}
h1{font:600 36px/1.1 var(--serif);color:var(--ink);text-align:center;margin:0;letter-spacing:.3px}
.sub{color:var(--goldt);text-align:center;font-size:10.5px;font-weight:500;letter-spacing:3.2px;text-transform:uppercase;margin:12px 0 8px}
.rule{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 28px}
.card{width:100%;max-width:400px;background:var(--paper);border:1px solid rgba(184,151,90,.3);border-radius:22px;padding:28px 22px 22px;box-shadow:0 30px 60px -36px rgba(42,36,32,.45)}
label.f{display:block;font-size:10.5px;font-weight:500;letter-spacing:2.2px;text-transform:uppercase;color:var(--goldt);margin:0 0 7px}
input[type=email],input[type=password]{width:100%;height:50px;font:16px var(--sans);padding:0 14px;border:1px solid var(--rule);border-radius:12px;background:var(--ivory);color:var(--ink);margin-bottom:18px;outline:none;-webkit-appearance:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,151,90,.22);background:#fff}
.rem{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;color:var(--ink);cursor:pointer;margin:-6px 0 14px}
.rem input{width:22px;height:22px;accent-color:#8f7038;margin:0}
button.go{width:100%;height:52px;border:1px solid #7a5c29;border-radius:14px;background:var(--gg);color:#fffaf0;font:600 15px var(--sans);letter-spacing:1.6px;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,250,235,.35),0 8px 18px -8px rgba(122,92,41,.55);text-shadow:0 1px 1px rgba(60,40,12,.3)}
button.go:disabled{opacity:.65}
.err{min-height:22px;color:var(--wine);font-size:14px;margin-top:12px;text-align:center}
.foot{color:var(--mute);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:26px;text-align:center}
</style>
</head>

<script>
(function(){
const EH='ce31f42104e369b77fe00a7b7b60a0b4119507a27ca76ba4f4372373d4e810d4',SK='agenda:k';
const T={it:{t:'Il viaggio di Cristina',u:'Email',p:'Password',r:'Ricordami',go:'Entra',wait:'Apertura…',bad:'Email o password non corretta.',miss:'Inserisci email e password.',ft:'Accesso riservato',nocrypto:'Questo browser non supporta la decifratura (serve HTTPS).'},
         en:{t:"Cristina's journey",u:'Email',p:'Password',r:'Remember me',go:'Sign in',wait:'Opening…',bad:'Incorrect email or password.',miss:'Enter your email and password.',ft:'Private access',nocrypto:'This browser cannot decrypt (HTTPS required).'}};
const $=id=>document.getElementById(id);
let lang=(function(){const q=(new URLSearchParams(location.search).get('lang')||'').toLowerCase();if(q==='it'||q==='en'){try{localStorage.setItem('lang',q)}catch(e){}return q}
 let s=null;try{s=localStorage.getItem('lang')}catch(e){}if(s==='it'||s==='en')return s;return (navigator.language||'en').toLowerCase().startsWith('it')?'it':'en'})();
function ui(){const x=T[lang];document.documentElement.lang=lang;$('t').textContent=x.t;$('lu').textContent=x.u;$('lp').textContent=x.p;$('lr').textContent=x.r;$('go').textContent=x.go;$('ft').textContent=x.ft;
 document.title=x.t;document.querySelectorAll('.lang button').forEach(b=>{b.classList.toggle('on',b.dataset.l===lang);b.setAttribute('aria-pressed',b.dataset.l===lang)});document.querySelector('.lang').setAttribute('aria-label',lang==='it'?'Lingua':'Language');}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch(e){}ui();if($('e').textContent)$('e').textContent='';});
ui();
const P=JSON.parse($('enc').textContent);
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=a=>{let s='';const u=new Uint8Array(a);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const subtle=window.crypto&&crypto.subtle;
async function derive(pw){const km=await subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return subtle.deriveKey({name:'PBKDF2',salt:ub(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open_(key){const pt=await subtle.decrypt({name:'AES-GCM',iv:ub(P.i)},key,ub(P.c));return new TextDecoder().decode(pt)}
function show(html){document.open();document.write(html);document.close()}
function store(){try{return {l:localStorage,s:sessionStorage}}catch(e){return null}}
(async function auto(){if(!subtle)return;const st=store();if(!st)return;const raw=st.l.getItem(SK)||st.s.getItem(SK);if(!raw)return;
 try{const k=await subtle.importKey('raw',ub(raw),{name:'AES-GCM'},false,['decrypt']);show(await open_(k))}catch(e){st.l.removeItem(SK);st.s.removeItem(SK)}})();
$('f').addEventListener('submit',async ev=>{ev.preventDefault();const x=T[lang],e=$('e');e.textContent='';
 if(!subtle){e.textContent=x.nocrypto;return}
 const u=$('u').value.trim().toLowerCase(),pw=$('p').value;if(!u||!pw){e.textContent=x.miss;return}
 $('go').disabled=true;$('go').textContent=x.wait;
 try{const uh=[...new Uint8Array(await subtle.digest('SHA-256',new TextEncoder().encode(u)))].map(x=>x.toString(16).padStart(2,'0')).join('');if(uh!==EH)throw 0;const k=await derive(pw);const html=await open_(k);const raw=bu(await subtle.exportKey('raw',k));const st=store();
  if(st){st.l.removeItem(SK);st.s.removeItem(SK);($('r').checked?st.l:st.s).setItem(SK,raw)}
  show(html)}
 catch(err){await new Promise(r=>setTimeout(r,400));e.textContent=x.bad;$('p').value='';$('p').focus();$('go').disabled=false;$('go').textContent=x.go}});
})();
