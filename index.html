<style>
:root{--navy:#0f1b2d;--navy2:#172740;--ivory:#f7f2e8;--gold:#c9a96e;--gold2:#e2cb98;--ink:#1d2433;--mut:#6b7280;--wine:#8a2b2b;--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 50% 0%,#1d3150 0%,var(--navy) 60%);color:var(--ink);font-family:var(--sans)}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 20px)}
.top{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 14px)}
.lang{display:flex;border:1px solid rgba(201,169,110,.5);border-radius:12px;overflow:hidden}
.lang button{min-width:44px;height:44px;border:0;background:transparent;color:var(--gold2);font:600 12px var(--sans);letter-spacing:1.5px;cursor:pointer}
.lang button.on{background:linear-gradient(160deg,#d8bd86,#b08d57);color:#1d160a}
.mark{width:72px;height:72px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold2);font:600 40px var(--serif);margin:0 auto 16px}
h1{font:600 34px/1.1 var(--serif);color:var(--ivory);text-align:center;margin:0}
.sub{color:var(--gold);text-align:center;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin:10px 0 26px}
.card{width:100%;max-width:400px;background:var(--ivory);border-radius:22px;padding:26px 22px;box-shadow:0 30px 60px rgba(0,0,0,.35),0 0 0 1px rgba(201,169,110,.35)}
label.f{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
input[type=email],input[type=password]{width:100%;height:50px;font:16px var(--sans);padding:0 14px;border:1px solid #d9cfbd;border-radius:12px;background:#fffdf8;color:var(--ink);margin-bottom:16px;outline:none;-webkit-appearance:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,110,.25)}
.rem{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;color:var(--ink);cursor:pointer;margin:-4px 0 12px}
.rem input{width:22px;height:22px;accent-color:#b08d57;margin:0}
button.go{width:100%;height:52px;border:0;border-radius:14px;background:linear-gradient(160deg,#d8bd86,#b08d57);color:#1d160a;font:600 15px var(--sans);letter-spacing:1px;cursor:pointer}
button.go:disabled{opacity:.6}
.err{min-height:22px;color:var(--wine);font-size:14px;margin-top:12px;text-align:center}
.foot{color:rgba(247,242,232,.45);font-size:12px;margin-top:22px;text-align:center}
</style>
</head>

<div class="top"><div class="lang" role="group" aria-label="Lingua"><button type="button" data-l="it">IT</button><button type="button" data-l="en">EN</button></div></div>

<h1 id="t">Il viaggio di Cristina</h1>

<form class="card" id="f" autocomplete="on" novalidate>
  <label class="f" for="u" id="lu">Email</label>
  <input type="email" id="u" name="username" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
  <label class="f" for="p" id="lp">Password</label>
  <input type="password" id="p" name="password" autocomplete="current-password" required>
  <label class="rem"><input type="checkbox" id="r"> <span id="lr">Ricordami</span></label>
  <button class="go" id="go" type="submit">Entra</button>
  <div class="err" id="e" role="alert" aria-live="polite"></div>
</form>

<script>
(function(){
const EMAIL='cristina@crisandcris.net',SK='agenda:k';
const T={it:{t:'Il viaggio di Cristina',u:'Email',p:'Password',r:'Ricordami',go:'Entra',wait:'Apertura…',bad:'Email o password non corretta.',miss:'Inserisci email e password.',ft:'Accesso riservato',nocrypto:'Questo browser non supporta la decifratura (serve HTTPS).'},
         en:{t:"Cristina's journey",u:'Email',p:'Password',r:'Remember me',go:'Sign in',wait:'Opening…',bad:'Incorrect email or password.',miss:'Enter your email and password.',ft:'Private access',nocrypto:'This browser cannot decrypt (HTTPS required).'}};
const $=id=>document.getElementById(id);
let lang=(function(){const q=(new URLSearchParams(location.search).get('lang')||'').toLowerCase();if(q==='it'||q==='en'){try{localStorage.setItem('lang',q)}catch(e){}return q}
 let s=null;try{s=localStorage.getItem('lang')}catch(e){}if(s==='it'||s==='en')return s;return (navigator.language||'en').toLowerCase().startsWith('it')?'it':'en'})();
function ui(){const x=T[lang];document.documentElement.lang=lang;$('t').textContent=x.t;$('lu').textContent=x.u;$('lp').textContent=x.p;$('lr').textContent=x.r;$('go').textContent=x.go;$('ft').textContent=x.ft;
 document.title=x.t;document.querySelectorAll('.lang button').forEach(b=>{b.classList.toggle('on',b.dataset.l===lang);b.setAttribute('aria-pressed',b.dataset.l===lang)});document.querySelector('.lang').setAttribute('aria-label',lang==='it'?'Lingua':'Language');}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch(e){}ui();if($('e').textContent)$('e').textContent='';});
ui();
const P=JSON.parse($('enc').textContent);
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=a=>{let s='';const u=new Uint8Array(a);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const subtle=window.crypto&&crypto.subtle;
async function derive(pw){const km=await subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return subtle.deriveKey({name:'PBKDF2',salt:ub(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open_(key){const pt=await subtle.decrypt({name:'AES-GCM',iv:ub(P.i)},key,ub(P.c));return new TextDecoder().decode(pt)}
function show(html){document.open();document.write(html);document.close()}
function store(){try{return {l:localStorage,s:sessionStorage}}catch(e){return null}}
(async function auto(){if(!subtle)return;const st=store();if(!st)return;const raw=st.l.getItem(SK)||st.s.getItem(SK);if(!raw)return;
 try{const k=await subtle.importKey('raw',ub(raw),{name:'AES-GCM'},false,['decrypt']);show(await open_(k))}catch(e){st.l.removeItem(SK);st.s.removeItem(SK)}})();
$('f').addEventListener('submit',async ev=>{ev.preventDefault();const x=T[lang],e=$('e');e.textContent='';
 if(!subtle){e.textContent=x.nocrypto;return}
 const u=$('u').value.trim().toLowerCase(),pw=$('p').value;if(!u||!pw){e.textContent=x.miss;return}
 $('go').disabled=true;$('go').textContent=x.wait;
 try{if(u!==EMAIL)throw 0;const k=await derive(pw);const html=await open_(k);const raw=bu(await subtle.exportKey('raw',k));const st=store();
  if(st){st.l.removeItem(SK);st.s.removeItem(SK);($('r').checked?st.l:st.s).setItem(SK,raw)}
  show(html)}
 catch(err){await new Promise(r=>setTimeout(r,400));e.textContent=x.bad;$('p').value='';$('p').focus();$('go').disabled=false;$('go').textContent=x.go}});
})();
</script>
