<style>
:root{--navy:#0f1b2d;--navy2:#172740;--ivory:#f7f2e8;--gold:#c9a96e;--gold2:#e2cb98;--ink:#1d2433;--mut:#6b7280;--wine:#8a2b2b;--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 50% 0%,#1d3150 0%,var(--navy) 60%);color:var(--ink);font-family:var(--sans)}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 20px)}
.top{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 14px)}
.lang{display:flex;border:1px solid rgba(201,169,110,.5);border-radius:12px;overflow:hidden}
.lang button{min-width:44px;height:44px;border:0;background:transparent;color:var(--gold2);font:600 12px var(--sans);letter-spacing:1.5px;cursor:pointer}
.lang button.on{background:linear-gradient(160deg,#d8bd86,#b08d57);color:#1d160a}
.mark{width:72px;height:72px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold2);font:600 40px var(--serif);margin:0 auto 16px}
h1{font:600 34px/1.1 var(--serif);color:var(--ivory);text-align:center;margin:0}
.sub{color:var(--gold);text-align:center;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin:10px 0 26px}
.card{width:100%;max-width:400px;background:var(--ivory);border-radius:22px;padding:26px 22px;box-shadow:0 30px 60px rgba(0,0,0,.35),0 0 0 1px rgba(201,169,110,.35)}
label.f{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
input[type=email],input[type=password]{width:100%;height:50px;font:16px var(--sans);padding:0 14px;border:1px solid #d9cfbd;border-radius:12px;background:#fffdf8;color:var(--ink);margin-bottom:16px;outline:none;-webkit-appearance:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,110,.25)}
.rem{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;color:var(--ink);cursor:pointer;margin:-4px 0 12px}
.rem input{width:22px;height:22px;accent-color:#b08d57;margin:0}
button.go{width:100%;height:52px;border:0;border-radius:14px;background:linear-gradient(160deg,#d8bd86,#b08d57);color:#1d160a;font:600 15px var(--sans);letter-spacing:1px;cursor:pointer}
button.go:disabled{opacity:.6}
.err{min-height:22px;color:var(--wine);font-size:14px;margin-top:12px;text-align:center}
.foot{color:rgba(247,242,232,.45);font-size:12px;margin-top:22px;text-align:center}
</style>
</head>

<h1 id="t">Il viaggio di Cristina</h1>

  <label class="f" for="p" id="lp">Password</label>
  <input type="password" id="p" name="password" autocomplete="current-password" required>
  <label class="rem"><input type="checkbox" id="r"> <span id="lr">Ricordami</span></label>

</form>
